<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHC Medical Staffing - Request Portal</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --primary:#C41E3A; --primary-dark:#9B1829; --accent:#E63946;
      --success:#2d6a4f; --warning:#f4a261;
      --bg:#fafbfc; --surface:#ffffff;
      --text:#1e293b; --text-muted:#64748b;
      --border:#e2e8f0; --shadow:rgba(196,30,58,.1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    .container{max-width:1400px;margin:0 auto;padding:0 24px}

    header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px var(--shadow)}
    .header-content{display:flex;justify-content:space-between;align-items:center}
    .logo-container{display:flex;align-items:center;gap:16px}
    .logo-container img{height:50px;width:auto;display:block}
    .employee-owned-badge{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.5px}

    .nav-tabs{display:flex;gap:8px}
    .nav-tab{padding:10px 20px;background:transparent;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:500;color:var(--text-muted);transition:.2s}
    .nav-tab:hover{background:var(--bg);color:var(--text)}
    .nav-tab.active{background:var(--primary);color:#fff}

    .view{display:none;padding:40px 0}
    .view.active{display:block}

    .form-card{background:var(--surface);border-radius:16px;padding:32px;box-shadow:0 4px 16px var(--shadow);max-width:800px;margin:0 auto}
    .form-header{margin-bottom:32px}
    .form-header h1{font-size:28px;font-weight:700;color:var(--text);margin-bottom:8px}
    .form-header p{color:var(--text-muted);font-size:15px}

    .trust-badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
    .badge{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(135deg,#f8f9fa,#fff);border:1px solid var(--border);border-radius:8px}
    .badge-icon{width:24px;height:24px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
    .badge span{font-size:13px;font-weight:600;color:var(--text)}

    .form-grid{display:grid;gap:24px}
