<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHC Medical Staffing - Request Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #C41E3A;
            --primary-dark: #9B1829;
            --accent: #E63946;
            --success: #2d6a4f;
            --warning: #f4a261;
            --bg: #fafbfc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: rgba(196, 30, 58, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-container img {
            height: 50px;
            width: auto;
        }

        .employee-owned-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ... rest of your CSS unchanged ... */
        /* Paste all your original CSS here from :root to the @media queries */
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo-container">
                    <!-- FIX LOGO: Replace src with your actual logo URL or base64 -->
                    <img src="https://via.placeholder.com/150x50?text=IHC+Logo" alt="IHC Medical Staffing">
                    <div class="employee-owned-badge">100% EMPLOYEE OWNED</div>
                </div>
                <div class="nav-tabs">
                    <button class="nav-tab active" onclick="switchView('request')">Submit Request</button>
                    <button class="nav-tab" onclick="switchView('dashboard')">Dashboard</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="requestView" class="view active">
            <div class="form-card">
                <div class="form-header">
                    <h1>Staffing Request</h1>
                    <p>Submit your staffing needs and we'll respond within 2 hours</p>
                </div>

                <div class="trust-badges">
                    <!-- your badges here -->
                </div>

                <div id="successMessage" class="success-message">
                    Request submitted successfully! We'll be in touch within 2 hours.
                </div>

                <form id="staffingForm"
                      action="https://formspree.io/f/YOUR_FORMSPREE_ID_HERE"  <!-- ← replace with real endpoint -->
                      method="POST"
                      class="form-grid">

                    <input type="hidden" name="_subject" value="New Staffing Request from [facilityName]">
                    <input type="hidden" name="_replyto" value="[email]">

                    <!-- Rest of your form fields unchanged -->
                    <!-- ... paste your full form content here ... -->

                    <button type="submit" class="submit-btn">Submit Staffing Request</button>
                </form>
            </div>
        </div>

        <!-- Dashboard view unchanged -->
        <!-- ... paste your dashboard HTML and script here ... -->
    </div>

    <!-- Your JavaScript here -->
    <!-- ... paste your original script (switchView, addDateShift, loadDashboard, etc.) ... -->
</body>
</html>
